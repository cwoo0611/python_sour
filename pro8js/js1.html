<!DOCTYPE html>

    <title>Document</title>
</head>
<body>
    ** 자바스크리브 : Client side script ** <br>
    <script>
    window.document.write("환영합니다. js 세상") //한 줄 주석 브라우저 화면으로 출력해
    document.write("<h2>안녕하세요</h2>")
    console.log("개발자를 위해 표준 출력 장치로 출력 - 기본 화면에는 보이지않음");
    </script>
    다시 html로 나옴
    <br>
    <script>
        document.write("<b>브라우저에 문자열 입력</b><br>");
        document.write("<i>이탤릭체 문자열 출력</i><br>");
        document.write("<a href='https://www.google.com'>구글로 이동</a></b><br>");
        </script>
        <script>
            let a = 10;
            let b = a + 10
            document.write("<br>b는",b);
        </script>
    </script>
    <br>자바스크립트 변수 값을 html 태그에 출력<br>
    b의 값은?<span id="result"></span>입니다
    <script>
        document.getElementById("result").textContent=b;
    </script>
    
    
</body>
