<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
ES6부터는 화살표 함수(arrow function)라는 새로운 문법 방식으로 함수를 만들 수 있게 되었다.
화살표 함수는 => 기호를 사용하여 function 키워드를 생략한다.<br>
함수 표현식 보다 단순한 문법으로 함수 처리가 가능해진다.<br>
형식 : let 변수 = (매개변수1,...) => {표현식}

<script>
    //참고:'use strict';는 javascript를 엄격 모드(strict Mode)로 실행하도록 하는 선언
    'use strict';

    //a = 10;  // 넌 안돼
    let a =10; // 와우 넌 돼
    console.log(a);
    // <script type="module"> 하면 'use strict'; 자동적용됨

    function hap0(a,b){ //함수 이름O
        return a + b;
    }
    document.write(hap0(3,4));
    let niceFunc = hap0;
    document.write(niceFunc(3,4));

    let hap1 = function(a,b){ //함수 이름 X
        return a + b;
    }
    document.write(hap1(3,4));
    document.write("<br>");
    let hap2 = (a,b) => a+b;
    document.write(hap2(3,4));

    document.write("<br>");
    let hap3 = (a,b) => {return a+b};
    document.write(hap2(3,4));

    let double1 = (n) => {return n * 2};
    document.write(`<br>결과는${double1(3)}`);

    let sayhi = () => document.write(`<br>안녕하세요`);
    sayhi()

    document.write("<hr>");
    let age = 25;
    let welcome = (age<30)? () => document.write(`<br>안녕`):document.write(`<br>반가워`)
    
    welcome();

    document.write("<br>");
    //합 계산
    let sumFunc = (a,b) => { //원래는 function sumfunc(a,b){,,,,,,}
        let result = a + b;
        return result;

    }
    document.write(`<br>두수의 합은${sumFunc(5,6)}`);

    document.write("<br>");
    //사칙연산 함수
    let calcFunc = (a, b, op) => {
        if(op === "+") return a + b;
        else if(op === "-") return a - b;
        else if(op === "*") return a * b;
        else if(op === "/") return a / b;
        else return 0;
    };
    document.write(calcFunc(10,5,"+"));
    document.write("<br>");
    document.write(calcFunc(10,5,"*"));

    // 배열 고차 함수 활용
    // filter() : 조건에 맞는 데이터 추출
    // map() : 데이터를 원하는 형태로 반환
    //forEach() : 데이터를 하나씩 반복 처리

    const employees = [
        {name:"가나다",pay:280},
        {name:"김치국",pay:350},
        {name:"박치기",pay:400},
        {name:"이겨라",pay:500},
    ];
    // 급여가 300 이상인 직원만 선택
    const highPay = employees.filter(emp => emp.pay >= 300);
    document.write("highPay :",highPay);
    console.log(highPay); //{name:"김치국",pay:350}...

    //급여를 10%인상
    // highPay.map():배열의 각 요소를 하나씩 꺼내 원하는 형태로 반환. 새로운 배열을 생성
    const result = highPay.map(emp => { //function(emp){ ... }
        return{
            name:emp.name,
            pay:emp.pay,
            newPay:emp.pay*1.1
        }
    });
    console.log(result); //{name: '김치국', pay: 350, newPay: 385.00000000000006}
    document.write("<br>");
    result.forEach(emp => {
        document.write(`${emp.name}:기존 ${emp.pay}만원 -> 인상 ${emp.pay}만원<br>`);
    })

    

</script>
    
</body>
</html>
