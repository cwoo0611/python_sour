<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- axiois cdn -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script> 
</head>
<body>
<h3>실무적인 AJAX 처리 방법 3가지</h3>
<button id="btn1">1) fetch then</button>
<button id="btn2">2) async fetch</button>
<button id="btn3">3) axios library</button>
<hr>
<div id="result"></div>

<script>
    document.querySelector("#btn1").onclick = funcFetch;
    document.querySelector("#btn2").onclick = funcAsync;
    document.querySelector("#btn3").onclick = funcAxios;

    // 1. fetch + then 방식
    function funcFetch(){
        fetch("sangpum.json")
            .then(response => {
                if(!response.ok){  // 반환값 수신 성공이 아닌 경우
                    throw new Error("서버 오류");
                }
                return response.json();   // 반환값 수신 성공인 경우 json을 반환
            })
            .then(data => {     // response.json() 의 결과를 받음
                let output = "<b>fetch then 결과</b><br>";
                alert(data);

                data.forEach(item => {
                    output += "코드:" + item.code + ", 품명:" + item.sang + "<br>";
                });
                document.getElementById("result").innerHTML = output;
            })
            .catch(error => {
                document.getElementById("result").innerHTML = "에러 발생 : " + error;
            });
    }

    // 2. async + await fetch 방식
    async function funcAsync(){   // 비동기 작업을 처리하는 함수. 함수 내부에서 await 사용 가능
        try{
            const response = await fetch("sangpum.json");
            if (!response.ok){
                throw new Error("서버 오류");
            }

            const data = await response.json();
            let output = "<b>async fetch 결과</b><br>";

            data.forEach(item => {
                output += "코드:" + item.code + ", 품명:" + item.sang + "<br>";
            });
            document.getElementById("result").innerHTML = output;
        }catch(error){
            document.getElementById("result").innerHTML = "에러 발생 : " + error;
        }
    }

    // 3. axios 방식
    async function funcAxios(){
        try{
             const response = await axios.get("sangpum.json");

            const data = response.data; //json 처리 해줌
            let output = "<b>axios결과</b><br>";

            data.forEach(item => {
                output += "코드:" + item.code + ", 품명:" + item.sang + "<br>";
            });
            document.getElementById("result").innerHTML = output;
            
        }catch(error){
            document.getElementById("result").innerHTML = "에러 발생 : " + error;
    }
}
</script>
</body>
</html>
