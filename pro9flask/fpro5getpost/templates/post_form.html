<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.querySelector("form[name='postform']")
            const btn = document.querySelector("#btnSend")

            btn.addEventListener("click", () => {
                form.requestSubmit(); // 입력 자료 검증 후 자료 전송
            })

            // 입력자료 검사
            form.addEventListener("submit", (event) => {
                const name = document.querySelector("#username").value.trim()
                const email = document.querySelector("#email").value.trim()

                if (!name) {
                    alert("이름 입력")
                    event.preventDefault();
                    return;
                }
                if (!email || !email.includes("@")) {
                    alert("올바른 이메일 입력")
                    event.preventDefault();
                    return;
                }
            })
        })
    </script>
</head>
<body>
    <h3>Post 방식처리</h3>
    <form action="/post_result" method="post" name="postform">
        이름: <input type="text" name="username" id="username" value="손오공"><br>
        이메일: <input type="text" name="email" id="email" value="abc@abc.com"><br>
        <input type="button" value="전송" id="btnSend">
    </form>
</body>
</html>
